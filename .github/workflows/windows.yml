name: Windows binary

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # Pin image explicitly (avoids windows-latest → VS2026 redirect notice).
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Smoke test (unit tests)
        run: cargo test --release --locked

      - name: Stage artifact
        shell: pwsh
        run: |
          $src = "target/release/yolomover.exe"
          if (-not (Test-Path $src)) { throw "Missing $src" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $src "dist/yolomover-x86_64-pc-windows-msvc.exe"
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            Copy-Item $src "dist/yolomover-$($env:GITHUB_REF_NAME)-x86_64-pc-windows-msvc.exe"
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: yolomover-windows-x86_64
          path: dist/yolomover-x86_64-pc-windows-msvc.exe
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/yolomover-${{ github.ref_name }}-x86_64-pc-windows-msvc.exe
          draft: false
          prerelease: false
