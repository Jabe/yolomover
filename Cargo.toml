[package]
name = "yolomover"
version = "2.1.1"
edition = "2021"
description = "Move the Windows Recovery partition to the end of the disk so you can extend C: (YOLO, but checked twice)"
license = "MIT"
repository = "https://github.com/Jabe/yolomover"
homepage = "https://github.com/Jabe/yolomover"
readme = "README.md"
keywords = ["windows", "gpt", "partition", "winre", "recovery"]
categories = ["command-line-utilities", "os::windows-apis"]

[[bin]]
name = "yolomover"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
crc32fast = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_UI_Shell",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
expect_used = "warn"
unwrap_used = "warn"
panic = "warn"
